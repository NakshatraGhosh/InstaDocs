<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign Up</title>
</head>
<body>
<h2>Sign Up</h2>
<form method="post" th:action="@{/signup}" th:object="${user}">
    <label>Username:</label>
    <input type="text" th:field="*{username}" required /><br/>
    <label>Email:</label>
    <input type="email" th:field="*{email}" required /><br/>
    <label>Password:</label>
    <input type="password" th:field="*{password}" required /><br/>
    <button type="submit">Sign Up</button>
</form>
<p>Already registered? <a th:href="@{/login}">Login here</a></p>
</body>
</html>
